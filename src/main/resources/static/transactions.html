<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 sidebar p-3">
                <h3 class="text-white mb-4">NorthBank</h3>
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="accounts.html">Accounts</a>
                    <a class="active" href="transactions.html">Transactions</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="withdraw.html">Withdraw</a>
                    <a href="transfer.html">Transfer</a>
                    <a href="profile.html">Profile</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4">
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Transactions</h4>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userBadge" class="badge bg-primary rounded-pill"></span>
                        <button class="btn btn-outline-dark btn-sm" onclick="logoutUser()">Logout</button>
                    </div>
                </div>

                <div class="page-card">
                    <div id="transactionsAlert" class="alert alert-danger d-none"></div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Reference</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Source</th>
                                    <th>Target</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
