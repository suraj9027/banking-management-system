<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 sidebar p-3">
                <h3 class="text-white mb-4">NorthBank</h3>
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a class="active" href="accounts.html">Accounts</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="withdraw.html">Withdraw</a>
                    <a href="transfer.html">Transfer</a>
                    <a href="profile.html">Profile</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4">
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Account Details</h4>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userBadge" class="badge bg-primary rounded-pill"></span>
                        <button class="btn btn-outline-dark btn-sm" onclick="logoutUser()">Logout</button>
                    </div>
                </div>

                <div class="page-card" style="max-width: 700px; margin: auto;">
                    <div id="accountAlert" class="alert alert-danger d-none"></div>
                    <div id="accountContent" class="mt-3">
                        <div class="row g-3">
                            <div class="col-md-6"><strong>Account Number:</strong> <span id="accountNumber"></span></div>
                            <div class="col-md-6"><strong>Type:</strong> <span id="accountType"></span></div>
                            <div class="col-md-6"><strong>Status:</strong> <span id="accountStatus"></span></div>
                            <div class="col-md-6"><strong>Balance:</strong> <span id="accountBalance"></span></div>
                            <div class="col-md-6"><strong>Created:</strong> <span id="accountCreated"></span></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();
        applyUserBadge();
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                document.getElementById('accountAlert').classList.remove('d-none');
                document.getElementById('accountAlert').textContent = 'No account id was provided.';
                return;
            }
            try {
                const account = await apiFetch(`/api/accounts/${id}`);
                document.getElementById('accountNumber').textContent = account.accountNumber;
                document.getElementById('accountType').textContent = account.accountType;
                document.getElementById('accountStatus').textContent = account.status;
                document.getElementById('accountBalance').textContent = formatCurrency(account.balance);
                document.getElementById('accountCreated').textContent = formatDate(account.createdAt);
            } catch (error) {
                document.getElementById('accountAlert').classList.remove('d-none');
                document.getElementById('accountAlert').textContent = error.message;
            }
        })();
    </script>
</body>
</html>
