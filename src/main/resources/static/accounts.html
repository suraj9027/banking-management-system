<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 sidebar p-3">
                <h3 class="text-white mb-4">NorthBank</h3>
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a class="active" href="accounts.html">Accounts</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="withdraw.html">Withdraw</a>
                    <a href="transfer.html">Transfer</a>
                    <a href="profile.html">Profile</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4">
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Accounts</h4>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userBadge" class="badge bg-primary rounded-pill"></span>
                        <button class="btn btn-outline-dark btn-sm" onclick="logoutUser()">Logout</button>
                    </div>
                </div>

                <div class="page-card mb-4">
                    <h5 class="mb-3">Open New Account</h5>
                    <form id="createAccountForm" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Account Type</label>
                            <select id="accountType" class="form-select" required>
                                <option value="SAVINGS">SAVINGS</option>
                                <option value="CHECKING">CHECKING</option>
                                <option value="BUSINESS">BUSINESS</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Initial Balance</label>
                            <input id="initialBalance" type="number" step="0.01" min="0" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </div>
                    </form>
                    <div id="createAccountAlert" class="alert alert-danger d-none mt-3"></div>
                    <div id="createAccountSuccess" class="alert alert-success d-none mt-3"></div>
                </div>

                <div class="page-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">My Accounts</h5>
                    </div>
                    <div id="accountsAlert" class="alert alert-danger d-none"></div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Account Number</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Balance</th>
                                    <th>Created</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="accountTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
