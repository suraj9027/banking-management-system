<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="auth-card">
            <h2 class="text-center mb-4">Open a New Account</h2>
            <form id="registerForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input id="firstName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input id="lastName" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Username</label>
                        <input id="username" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Email</label>
                        <input id="email" type="email" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Password</label>
                        <input id="password" type="password" class="form-control" required>
                    </div>
                </div>
                <div id="registerAlert" class="alert alert-danger d-none mt-3"></div>
                <button class="btn btn-success w-100 mt-4" type="submit">Register</button>
            </form>
            <div class="mt-3 text-center">
                <span>Already registered?</span>
                <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        redirectIfLoggedIn();
        document.getElementById('registerForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const alertBox = document.getElementById('registerAlert');
            try {
                await registerUser({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    role: 'CUSTOMER'
                });
                window.location.href = 'login.html';
            } catch (error) {
                alertBox.classList.remove('d-none');
                alertBox.textContent = error.message;
            }
        });
    </script>
</body>
</html>
