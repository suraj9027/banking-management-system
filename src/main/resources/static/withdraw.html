<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 sidebar p-3">
                <h3 class="text-white mb-4">NorthBank</h3>
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="accounts.html">Accounts</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="deposit.html">Deposit</a>
                    <a class="active" href="withdraw.html">Withdraw</a>
                    <a href="transfer.html">Transfer</a>
                    <a href="profile.html">Profile</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4">
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Withdraw</h4>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userBadge" class="badge bg-primary rounded-pill"></span>
                        <button class="btn btn-outline-dark btn-sm" onclick="logoutUser()">Logout</button>
                    </div>
                </div>

                <div class="page-card" style="max-width: 700px; margin: auto;">
                    <h5>Withdraw funds</h5>
                    <form id="withdrawForm">
                        <div class="mb-3">
                            <label class="form-label">Account ID</label>
                            <input id="accountId" class="form-control" type="number" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input id="amount" class="form-control" type="number" step="0.01" min="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input id="description" class="form-control" placeholder="Optional note">
                        </div>
                        <div id="withdrawAlert" class="alert alert-danger d-none"></div>
                        <div id="withdrawSuccess" class="alert alert-success d-none"></div>
                        <button class="btn btn-warning" type="submit">Submit Withdrawal</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();
        applyUserBadge();
        document.getElementById('withdrawForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const alert = document.getElementById('withdrawAlert');
            const success = document.getElementById('withdrawSuccess');
            try {
                const payload = {
                    amount: Number(document.getElementById('amount').value),
                    description: document.getElementById('description').value
                };
                await apiFetch(`/api/accounts/${document.getElementById('accountId').value}/withdraw`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                success.classList.remove('d-none');
                success.textContent = 'Withdrawal completed successfully.';
                alert.classList.add('d-none');
                document.getElementById('withdrawForm').reset();
            } catch (error) {
                alert.classList.remove('d-none');
                alert.textContent = error.message;
                success.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
