<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 sidebar p-3">
                <h3 class="text-white mb-4">NorthBank</h3>
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="accounts.html">Accounts</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="withdraw.html">Withdraw</a>
                    <a href="transfer.html">Transfer</a>
                    <a class="active" href="profile.html">Profile</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4">
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Profile</h4>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userBadge" class="badge bg-primary rounded-pill"></span>
                        <button class="btn btn-outline-dark btn-sm" onclick="logoutUser()">Logout</button>
                    </div>
                </div>

                <div class="page-card" style="max-width: 600px; margin: auto;">
                    <h5>User Information</h5>
                    <div class="mb-3">
                        <strong>Username:</strong> <span id="profileUsername"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Email:</strong> <span id="profileEmail"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Name:</strong> <span id="profileName"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Role:</strong> <span id="profileRole"></span>
                    </div>
                    <button class="btn btn-outline-danger" onclick="logoutUser()">Logout</button>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();
        applyUserBadge();
        (async function() {
            const user = await loadCurrentUser();
            if (user) {
                document.getElementById('profileUsername').textContent = user.username;
                document.getElementById('profileEmail').textContent = user.email;
                document.getElementById('profileName').textContent = `${user.firstName} ${user.lastName}`;
                document.getElementById('profileRole').textContent = user.role;
            }
        })();
    </script>
</body>
</html>
