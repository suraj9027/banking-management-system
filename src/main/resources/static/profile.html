<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 sidebar p-3">
                <h3 class="text-white mb-4">NorthBank</h3>
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="accounts.html">Accounts</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="withdraw.html">Withdraw</a>
                    <a href="transfer.html">Transfer</a>
                    <a class="active" href="profile.html">Profile</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4">
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Profile</h4>
                    <div class="d-flex align-items-center gap-3">
                        <span id="userBadge" class="badge bg-primary rounded-pill"></span>
                        <button class="btn btn-outline-dark btn-sm" onclick="logoutUser()">Logout</button>
                    </div>
                </div>

                <div class="page-card" style="max-width: 600px; margin: auto;">
                    <h5>User Information</h5>
                    <div class="mb-3">
                        <strong>Username:</strong> <span id="profileUsername"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Role:</strong> <span id="profileRole"></span>
                    </div>
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label" for="profileEmail">Email</label>
                            <input id="profileEmail" type="email" class="form-control" maxlength="150" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="profileFirstName">First name</label>
                            <input id="profileFirstName" class="form-control" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="profileLastName">Last name</label>
                            <input id="profileLastName" class="form-control" maxlength="100" required>
                        </div>
                        <div id="profileAlert" class="alert alert-danger d-none" role="alert"></div>
                        <div id="profileSuccess" class="alert alert-success d-none" role="status"></div>
                        <button class="btn btn-primary" type="submit">Save changes</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;
            applyUserBadge();
            const alert = document.getElementById('profileAlert');
            try {
                const user = await loadCurrentUser();
                if (!user) return;
                document.getElementById('profileUsername').textContent = user.username;
                document.getElementById('profileEmail').value = user.email;
                document.getElementById('profileFirstName').value = user.firstName;
                document.getElementById('profileLastName').value = user.lastName;
                document.getElementById('profileRole').textContent = user.role;
            } catch (error) {
                alert.classList.remove('d-none');
                alert.textContent = error.message;
                return;
            }

            document.getElementById('profileForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const button = event.currentTarget.querySelector('button[type="submit"]');
                const success = document.getElementById('profileSuccess');
                button.disabled = true;
                try {
                    const user = await apiFetch('/api/auth/me', {
                        method: 'PUT',
                        body: JSON.stringify({
                            email: document.getElementById('profileEmail').value,
                            firstName: document.getElementById('profileFirstName').value,
                            lastName: document.getElementById('profileLastName').value
                        })
                    });
                    saveUser(user);
                    applyUserBadge();
                    success.classList.remove('d-none');
                    success.textContent = 'Profile updated successfully.';
                    alert.classList.add('d-none');
                } catch (error) {
                    alert.classList.remove('d-none');
                    alert.textContent = error.message;
                    success.classList.add('d-none');
                } finally {
                    button.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
